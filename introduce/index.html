        <script>
            // 스크롤 스냅 캐러셀: 화살표/점은 track 스크롤만 움직인다.
            (function ()
            {
                const track = document.querySelector('.carousel .track');
                const slides = [...track.children];
                const dots = document.querySelector('.carousel .dots');
                const go = i =>
                {
                    track.scrollTo({ left: track.clientWidth * ((i + slides.length) % slides.length), behavior: 'smooth' });
                };
                const current = () => Math.round(track.scrollLeft / track.clientWidth);
                slides.forEach((_, i) =>
                {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.setAttribute('aria-label', (i + 1) + '번째 캐릭터');
                    b.onclick = () => go(i);
                    dots.appendChild(b);
                });
                const sync = () =>
                {
                    [...dots.children].forEach((d, i) => d.setAttribute('aria-current', i === current()));
                };
                track.addEventListener('scroll', sync, { passive: true });
                document.querySelector('.carousel .prev').onclick = () => go(current() - 1);
                document.querySelector('.carousel .next').onclick = () => go(current() + 1);
                sync();
            })();
        </script>
